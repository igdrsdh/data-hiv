<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedData HIV Cloud - RS Dian Husada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Jost', 'Google Sans', 'sans-serif'] },
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;700&family=Jost:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @media (min-width: 1024px) { body { overflow: hidden; } }
        @media print {
            @page { size: A4; margin: 0.8cm; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white !important; color: black !important; font-size: 9pt !important; overflow: visible !important; }
            main { display: block !important; padding: 0 !important; }
            .lg\:col-span-8 { width: 100% !important; }
        }
        .print-only { display: none; }
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark .custom-scroll::-webkit-scrollbar-thumb { background: #334155; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-[#0f1113] text-slate-900 dark:text-slate-100 transition-colors duration-300 min-h-screen">
    <div id="root"></div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, addDoc, deleteDoc, updateDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA0HNTB7x7siB9Ps4cT5MRPhPSw7In5NaY",
            authDomain: "data-pasien-hiv.firebaseapp.com",
            projectId: "data-pasien-hiv",
            storageBucket: "data-pasien-hiv.firebasestorage.app",
            messagingSenderId: "770845270634",
            appId: "1:770845270634:web:63e2f522a00d20534fe013"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Export to window for React component access
        window.FB = { auth, db, collection, doc, addDoc, deleteDoc, updateDoc, onSnapshot, query, orderBy, signInWithEmailAndPassword, onAuthStateChanged, signOut };
    </script>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);
            const [authData, setAuthData] = useState({ email: '', password: '' });
            const [isLoggingIn, setIsLoggingIn] = useState(false);
            const [errorMessage, setErrorMessage] = useState('');
            
            const [patients, setPatients] = useState([]);
            const [isDarkMode, setIsDarkMode] = useState(() => localStorage.getItem('theme') === 'dark');
            const [formData, setFormData] = useState({ name: '', recordNumber: '', address: '', diagnosis: '', status: 'Hidup' });
            const [searchTerm, setSearchTerm] = useState('');
            const [editingId, setEditingId] = useState(null);

            useEffect(() => {
                const interval = setInterval(() => {
                    if (window.FB) {
                        clearInterval(interval);
                        window.FB.onAuthStateChanged(window.FB.auth, (u) => {
                            setUser(u);
                            setAuthLoading(false);
                        });
                    }
                }, 100);
                return () => clearInterval(interval);
            }, []);

            useEffect(() => {
                if (!user || !window.FB) return;
                const { db, collection, onSnapshot } = window.FB;
                const q = collection(db, "patients");
                const unsubscribe = onSnapshot(q, (snapshot) => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setPatients(data.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)));
                }, (err) => console.error("Firestore Error:", err));
                return () => unsubscribe();
            }, [user]);

            useEffect(() => {
                if (isDarkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', isDarkMode ? 'dark' : 'light');
            }, [isDarkMode]);

            const handleLogin = async (e) => {
                e.preventDefault();
                setIsLoggingIn(true);
                setErrorMessage('');
                try {
                    await window.FB.signInWithEmailAndPassword(window.FB.auth, authData.email, authData.password);
                } catch (err) {
                    setErrorMessage("Gagal masuk. Periksa kembali email/password.");
                } finally {
                    setIsLoggingIn(false);
                }
            };

            const handleLogout = () => window.FB.signOut(window.FB.auth);

            const handleSubmit = async (e) => {
                e.preventDefault();
                try {
                    if (editingId) {
                        // Logic Update
                        await window.FB.updateDoc(window.FB.doc(window.FB.db, "patients", editingId), {
                            ...formData,
                            updatedAt: Date.now()
                        });
                        setEditingId(null);
                    } else {
                        // Logic Add New
                        await window.FB.addDoc(window.FB.collection(window.FB.db, "patients"), {
                            ...formData,
                            createdAt: Date.now(),
                            dateAdded: new Date().toLocaleDateString('id-ID')
                        });
                    }
                    setFormData({ name: '', recordNumber: '', address: '', diagnosis: '', status: 'Hidup' });
                } catch (err) { 
                    console.error(err);
                    alert("Gagal memproses data."); 
                }
            };

            const startEdit = (patient) => {
                setEditingId(patient.id);
                setFormData({
                    name: patient.name,
                    recordNumber: patient.recordNumber,
                    address: patient.address,
                    diagnosis: patient.diagnosis,
                    status: patient.status
                });
                // Smooth scroll to top for mobile users to see the form
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const cancelEdit = () => {
                setEditingId(null);
                setFormData({ name: '', recordNumber: '', address: '', diagnosis: '', status: 'Hidup' });
            };

            const handleDelete = async (id) => {
                if (!confirm("Hapus data pasien ini secara permanen?")) return;
                try {
                    await window.FB.deleteDoc(window.FB.doc(window.FB.db, "patients", id));
                    if (editingId === id) cancelEdit();
                } catch (err) { alert("Gagal menghapus data."); }
            };

            if (authLoading) return (
                <div className="min-h-screen flex items-center justify-center bg-slate-50 dark:bg-[#0f1113]">
                    <div className="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
                </div>
            );

            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 bg-slate-100 dark:bg-[#0f1113]">
                        <div className="bg-white dark:bg-[#1e2124] p-8 md:p-12 rounded-[2.5rem] shadow-2xl w-full max-w-md border border-slate-200 dark:border-slate-800">
                            <div className="text-center mb-10">
                                <div className="inline-block p-5 bg-blue-600 rounded-[2rem] text-white mb-6 shadow-2xl shadow-blue-500/40">
                                    <Icon name="shield-check" size={40} />
                                </div>
                                <h1 className="text-2xl font-bold tracking-tight">Login MedData</h1>
                                <p className="text-slate-500 text-sm mt-2">RS Dian Husada - HIV Cloud System</p>
                            </div>
                            {errorMessage && <div className="mb-6 p-4 bg-rose-50 text-rose-600 text-xs rounded-xl border border-rose-100">{errorMessage}</div>}
                            <form onSubmit={handleLogin} className="space-y-5">
                                <input type="email" placeholder="Email Address" value={authData.email} onChange={e => setAuthData({...authData, email: e.target.value})} className="w-full px-6 py-4 rounded-2xl bg-slate-50 dark:bg-[#131517] outline-none" required />
                                <input type="password" placeholder="Password" value={authData.password} onChange={e => setAuthData({...authData, password: e.target.value})} className="w-full px-6 py-4 rounded-2xl bg-slate-50 dark:bg-[#131517] outline-none" required />
                                <button type="submit" disabled={isLoggingIn} className="w-full py-4 bg-blue-600 text-white font-bold rounded-2xl">
                                    {isLoggingIn ? "Memuat..." : "Masuk Sistem"}
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            const filteredPatients = patients.filter(p => 
                p.name?.toLowerCase().includes(searchTerm.toLowerCase()) || 
                p.recordNumber?.toLowerCase().includes(searchTerm.toLowerCase())
            );

            return (
                <div className="h-screen flex flex-col">
                    <nav className="no-print bg-white/70 dark:bg-[#1a1c1e]/70 border-b border-slate-200 dark:border-slate-800 px-6 py-3 shrink-0 backdrop-blur-md z-10">
                        <div className="max-w-7xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="bg-blue-600 p-2 rounded-lg text-white"><Icon name="activity" size={18} /></div>
                                <div>
                                    <span className="text-base font-bold block leading-none">RS Dian Husada</span>
                                    <span className="text-[9px] text-blue-500 font-bold uppercase tracking-widest">HIV Cloud Database</span>
                                </div>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800">
                                    {isDarkMode ? <Icon name="sun" className="text-yellow-400" size={18} /> : <Icon name="moon" className="text-blue-600" size={18} />}
                                </button>
                                <button onClick={() => window.print()} className="bg-slate-900 text-white dark:bg-white dark:text-slate-900 px-4 py-1.5 rounded-xl text-[10px] font-bold flex items-center gap-2">
                                    <Icon name="printer" size={12} /> Cetak
                                </button>
                                <button onClick={handleLogout} className="p-2 text-rose-500"><Icon name="log-out" size={18} /></button>
                            </div>
                        </div>
                    </nav>

                    <main className="flex-1 overflow-hidden max-w-7xl mx-auto w-full p-6 grid grid-cols-1 lg:grid-cols-12 gap-8">
                        <aside className="no-print lg:col-span-4 h-full">
                            <div className="bg-white dark:bg-[#1e2124] p-6 rounded-[2rem] shadow-sm border border-slate-200 dark:border-slate-800">
                                <h2 className="text-base font-bold mb-4 flex items-center gap-2">
                                    <Icon name={editingId ? "edit" : "user-plus"} className={editingId ? "text-amber-500" : "text-blue-500"} size={16} /> 
                                    {editingId ? "Edit Data Pasien" : "Registrasi Pasien"}
                                </h2>
                                <form onSubmit={handleSubmit} className="space-y-3">
                                    <input type="text" placeholder="Nama Lengkap" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full px-4 py-2.5 rounded-xl bg-slate-50 dark:bg-[#131517] border-none text-xs" required />
                                    <div className="grid grid-cols-2 gap-2">
                                        <input type="text" placeholder="No. Rekam Medis" value={formData.recordNumber} onChange={e => setFormData({...formData, recordNumber: e.target.value})} className="w-full px-4 py-2.5 rounded-xl bg-slate-50 dark:bg-[#131517] border-none text-xs" required />
                                        <select value={formData.status} onChange={e => setFormData({...formData, status: e.target.value})} className="w-full px-4 py-2.5 rounded-xl bg-slate-50 dark:bg-[#131517] border-none text-xs">
                                            <option value="Hidup">Hidup</option>
                                            <option value="Meninggal">Meninggal</option>
                                        </select>
                                    </div>
                                    <input type="text" placeholder="Diagnosa" value={formData.diagnosis} onChange={e => setFormData({...formData, diagnosis: e.target.value})} className="w-full px-4 py-2.5 rounded-xl bg-slate-50 dark:bg-[#131517] border-none text-xs" required />
                                    <textarea placeholder="Alamat Lengkap" value={formData.address} onChange={e => setFormData({...formData, address: e.target.value})} className="w-full px-4 py-2.5 rounded-xl bg-slate-50 dark:bg-[#131517] border-none text-xs" rows="2" required></textarea>
                                    
                                    <div className="flex flex-col gap-2 pt-1">
                                        <button type="submit" className={`w-full py-3 text-white font-bold rounded-xl text-[10px] uppercase tracking-widest transition-colors ${editingId ? 'bg-amber-500 hover:bg-amber-600' : 'bg-blue-600 hover:bg-blue-700'}`}>
                                            {editingId ? "Perbarui Data" : "Simpan Ke Cloud"}
                                        </button>
                                        {editingId && (
                                            <button type="button" onClick={cancelEdit} className="w-full py-2 text-slate-500 dark:text-slate-400 text-[10px] font-bold uppercase tracking-tight">
                                                Batal Edit
                                            </button>
                                        )}
                                    </div>
                                </form>

                                {/* Total Pasien Widget */}
                                <div className="mt-6 p-4 bg-blue-50 dark:bg-blue-900/10 rounded-2xl border border-blue-100 dark:border-blue-800">
                                    <div className="flex items-center justify-between">
                                        <span className="text-[10px] font-bold text-blue-600 dark:text-blue-400 uppercase tracking-tighter">Total Terdaftar</span>
                                        <Icon name="users" size={14} className="text-blue-500" />
                                    </div>
                                    <div className="text-2xl font-bold mt-1">{patients.length} <span className="text-[10px] font-normal text-slate-400">Pasien</span></div>
                                </div>
                            </div>
                        </aside>

                        <section className="lg:col-span-8 flex flex-col h-full overflow-hidden">
                            <div className="no-print flex items-center gap-4 mb-4">
                                <div className="flex-1 bg-white dark:bg-[#1e2124] px-4 py-2.5 rounded-2xl border border-slate-200 dark:border-slate-800 flex items-center gap-3">
                                    <Icon name="search" className="text-slate-400" size={14} />
                                    <input type="text" placeholder="Cari Pasien (Nama / No. RM)..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} className="w-full bg-transparent outline-none text-xs" />
                                </div>
                                <div className="bg-blue-600 px-4 py-2.5 rounded-2xl text-white text-[10px] font-bold whitespace-nowrap">
                                    {filteredPatients.length} Ditemukan
                                </div>
                            </div>

                            <div className="print-only mb-6 border-b-2 border-black pb-4 text-center">
                                <h1 className="text-2xl font-bold uppercase">RS Dian Husada</h1>
                                <p className="text-xs">Laporan Data Pasien Terintegrasi - {new Date().toLocaleDateString('id-ID')}</p>
                                <p className="text-[10px] mt-1 font-bold">Total Pasien: {filteredPatients.length}</p>
                            </div>

                            <div className="flex-1 overflow-y-auto custom-scroll pr-1 no-print">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-3 pb-4">
                                    {filteredPatients.length > 0 ? filteredPatients.map((p, idx) => (
                                        <div key={p.id} className={`bg-white dark:bg-[#1e2124] p-4 rounded-2xl border transition-all shadow-sm ${editingId === p.id ? 'border-amber-500 ring-1 ring-amber-500' : 'border-slate-200 dark:border-slate-800 hover:border-blue-500/50'} ${p.status === 'Meninggal' && editingId !== p.id ? 'opacity-60' : ''}`}>
                                            <div>
                                                <div className="flex items-center justify-between mb-2">
                                                    <div className="flex items-center gap-2 min-w-0">
                                                        <span className="text-[10px] font-bold text-slate-300">#{filteredPatients.length - idx}</span>
                                                        <div className={`w-2 h-2 rounded-full shrink-0 ${p.status === 'Hidup' ? 'bg-emerald-500 animate-pulse' : 'bg-slate-400'}`}></div>
                                                        <span className="font-bold text-sm truncate uppercase">{p.name}</span>
                                                    </div>
                                                    <div className="flex items-center gap-1 shrink-0">
                                                        <button onClick={() => startEdit(p)} className="text-slate-300 hover:text-blue-500 transition-colors p-1" title="Edit Data"><Icon name="edit-3" size={14} /></button>
                                                        <button onClick={() => handleDelete(p.id)} className="text-slate-300 hover:text-rose-500 transition-colors p-1" title="Hapus Data"><Icon name="trash-2" size={14} /></button>
                                                    </div>
                                                </div>
                                                <div className="flex flex-wrap gap-1.5 mb-2">
                                                    <span className="px-1.5 py-0.5 bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 rounded-md text-[9px] font-bold border border-blue-100 dark:border-blue-800">{p.recordNumber}</span>
                                                    <span className="px-1.5 py-0.5 bg-rose-50 dark:bg-rose-900/20 text-rose-600 dark:text-rose-400 rounded-md text-[9px] font-bold border border-rose-100 dark:border-rose-800">{p.diagnosis}</span>
                                                </div>
                                                <p className="text-[10px] text-slate-500 dark:text-slate-400 line-clamp-1 italic">{p.address}</p>
                                            </div>
                                        </div>
                                    )) : (
                                        <div className="col-span-full py-20 text-center"><p className="text-slate-400 text-xs italic">Data tidak ditemukan</p></div>
                                    )}
                                </div>
                            </div>

                            <div className="print-only">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="border-b-2 border-slate-300 text-[10px] uppercase tracking-wider">
                                            <th className="py-2 w-10">No.</th>
                                            <th className="py-2">No. RM</th>
                                            <th className="py-2">Nama Pasien</th>
                                            <th className="py-2">Diagnosa</th>
                                            <th className="py-2">Status</th>
                                            <th className="py-2">Alamat</th>
                                        </tr>
                                    </thead>
                                    <tbody className="text-[9px]">
                                        {filteredPatients.map((p, index) => (
                                            <tr key={p.id} className="border-b border-slate-100">
                                                <td className="py-2 text-center">{index + 1}</td>
                                                <td className="py-2 font-bold">{p.recordNumber}</td>
                                                <td className="py-2 uppercase">{p.name}</td>
                                                <td className="py-2">{p.diagnosis}</td>
                                                <td className="py-2">{p.status}</td>
                                                <td className="py-2">{p.address}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                                <div className="mt-8 text-[9px] text-right">
                                    Dicetak secara otomatis oleh Sistem MedData HIV Cloud pada {new Date().toLocaleString('id-ID')}
                                </div>
                            </div>
                        </section>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
