<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedData HIV Cloud - RS Dian Husada</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Jost', 'Google Sans', 'sans-serif'] },
                }
            }
        }
    </script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;700&family=Jost:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Sembunyikan scrollbar utama jika di desktop agar lebih aplikasi-sentris */
        @media (min-width: 1024px) {
            body { overflow: hidden; }
        }

        @media print {
            @page {
                size: A4;
                margin: 0.8cm;
            }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { 
                background: white !important; 
                color: black !important; 
                font-size: 9pt !important;
                overflow: visible !important;
            }
            main { display: block !important; padding: 0 !important; }
            .lg\:col-span-8 { width: 100% !important; }
            
            .print-list {
                display: table !important;
                width: 100% !important;
                border-collapse: collapse !important;
            }
            .card-item { 
                display: table-row !important;
                border-bottom: 0.5pt solid #eee !important;
            }
            .patient-address { line-clamp: none !important; white-space: normal !important; }
        }

        .print-only { display: none; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        
        /* Custom scrollbar untuk area list */
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark .custom-scroll::-webkit-scrollbar-thumb { background: #334155; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-[#0f1113] text-slate-900 dark:text-slate-100 transition-colors duration-300 min-h-screen">
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA0HNTB7x7siB9Ps4cT5MRPhPSw7In5NaY",
            authDomain: "data-pasien-hiv.firebaseapp.com",
            projectId: "data-pasien-hiv",
            storageBucket: "data-pasien-hiv.firebasestorage.app",
            messagingSenderId: "770845270634",
            appId: "1:770845270634:web:63e2f522a00d20534fe013"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.FB = { auth, db, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot, query, signInWithEmailAndPassword, onAuthStateChanged, signOut };
    </script>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);
            const [authData, setAuthData] = useState({ email: '', password: '' });
            const [isLoggingIn, setIsLoggingIn] = useState(false);
            
            const [patients, setPatients] = useState([]);
            const [isDarkMode, setIsDarkMode] = useState(() => localStorage.getItem('theme') === 'dark');
            const [formData, setFormData] = useState({ name: '', recordNumber: '', address: '', diagnosis: '', status: 'Hidup' });
            const [searchTerm, setSearchTerm] = useState('');

            useEffect(() => {
                const checkFB = setInterval(() => {
                    if (window.FB) {
                        clearInterval(checkFB);
                        window.FB.onAuthStateChanged(window.FB.auth, (u) => {
                            setUser(u);
                            setAuthLoading(false);
                        });
                    }
                }, 100);
            }, []);

            useEffect(() => {
                if (!user || !window.FB) return;
                const { db, collection, onSnapshot } = window.FB;
                const q = collection(db, "patients");
                
                const unsubscribe = onSnapshot(q, (snapshot) => {
                    const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setPatients(data.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)));
                }, (err) => {
                    console.error(err);
                });

                return () => unsubscribe();
            }, [user]);

            useEffect(() => {
                if (isDarkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', isDarkMode ? 'dark' : 'light');
            }, [isDarkMode]);

            const handleLogin = async (e) => {
                e.preventDefault();
                setIsLoggingIn(true);
                try {
                    await window.FB.signInWithEmailAndPassword(window.FB.auth, authData.email, authData.password);
                } catch (err) {
                    alert("Gagal masuk. Periksa email dan password.");
                } finally {
                    setIsLoggingIn(false);
                }
            };

            const handleLogout = () => {
                if(confirm("Apakah Anda yakin ingin keluar?")) {
                    window.FB.signOut(window.FB.auth);
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                try {
                    await window.FB.addDoc(window.FB.collection(window.FB.db, "patients"), {
                        ...formData,
                        createdAt: Date.now(),
                        dateAdded: new Date().toLocaleDateString('id-ID')
                    });
                    setFormData({ name: '', recordNumber: '', address: '', diagnosis: '', status: 'Hidup' });
                } catch (err) {
                    alert("Gagal menyimpan: " + err.message);
                }
            };

            const handleDelete = async (id) => {
                if (!confirm("Hapus data pasien ini?")) return;
                try {
                    await window.FB.deleteDoc(window.FB.doc(window.FB.db, "patients", id));
                } catch (err) {
                    alert("Gagal menghapus: " + err.message);
                }
            };

            if (authLoading) return <div className="min-h-screen flex items-center justify-center">Memuat...</div>;

            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 bg-slate-100 dark:bg-[#0f1113]">
                        <div className="bg-white dark:bg-[#1e2124] p-8 md:p-12 rounded-[2.5rem] shadow-2xl w-full max-w-md border border-slate-200 dark:border-slate-800">
                            <div className="text-center mb-10">
                                <div className="inline-block p-5 bg-blue-600 rounded-[2rem] text-white mb-6 shadow-2xl shadow-blue-500/40">
                                    <Icon name="shield-check" size={40} />
                                </div>
                                <h1 className="text-2xl font-bold tracking-tight">Login MedData</h1>
                                <p className="text-slate-500 text-sm mt-2">Masuk dengan akun institusi RS Dian Husada</p>
                            </div>
                            <form onSubmit={handleLogin} className="space-y-5">
                                <div className="space-y-1">
                                    <label className="text-[10px] font-bold text-slate-400 uppercase ml-2 tracking-widest">Email Address</label>
                                    <input 
                                        type="email" 
                                        placeholder="nama@rsdianhusada.com" 
                                        value={authData.email} 
                                        onChange={e => setAuthData({...authData, email: e.target.value})} 
                                        className="w-full px-6 py-4 rounded-2xl bg-slate-50 dark:bg-[#131517] border-none focus:ring-2 ring-blue-500 outline-none transition-all" 
                                        required 
                                    />
                                </div>
                                <div className="space-y-1">
                                    <label className="text-[10px] font-bold text-slate-400 uppercase ml-2 tracking-widest">Password</label>
                                    <input 
                                        type="password" 
                                        placeholder="••••••••" 
                                        value={authData.password} 
                                        onChange={e => setAuthData({...authData, password: e.target.value})} 
                                        className="w-full px-6 py-4 rounded-2xl bg-slate-50 dark:bg-[#131517] border-none focus:ring-2 ring-blue-500 outline-none transition-all" 
                                        required 
                                    />
                                </div>
                                <button 
                                    type="submit" 
                                    disabled={isLoggingIn}
                                    className="w-full py-4 bg-blue-600 text-white font-bold rounded-2xl shadow-lg hover:bg-blue-700 active:scale-95 transition-all uppercase tracking-widest text-sm mt-4 flex justify-center items-center gap-2"
                                >
                                    {isLoggingIn ? <div className="h-4 w-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div> : "Masuk Sistem"}
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            const filteredPatients = patients.filter(p => 
                p.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                p.recordNumber.toLowerCase().includes(searchTerm.toLowerCase())
            );

            return (
                <div className="h-screen flex flex-col">
                    <nav className="no-print bg-white/70 dark:bg-[#1a1c1e]/70 border-b border-slate-200 dark:border-slate-800 px-6 py-3 shrink-0">
                        <div className="max-w-7xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="bg-blue-600 p-2 rounded-lg text-white shadow-lg shadow-blue-500/20"><Icon name="activity" size={18} /></div>
                                <div>
                                    <span className="text-base font-bold block leading-none">RS Dian Husada</span>
                                    <span className="text-[9px] text-blue-500 font-bold uppercase tracking-widest">HIV Cloud</span>
                                </div>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500">
                                    {isDarkMode ? <Icon name="sun" className="text-yellow-400" size={18} /> : <Icon name="moon" className="text-blue-600" size={18} />}
                                </button>
                                <button onClick={() => window.print()} className="bg-slate-900 text-white dark:bg-white dark:text-slate-900 px-4 py-1.5 rounded-xl text-[10px] font-bold flex items-center gap-2">
                                    <Icon name="printer" size={12} /> Cetak
                                </button>
                                <button onClick={handleLogout} className="p-2 text-rose-500 hover:bg-rose-50 rounded-full"><Icon name="log-out" size={18} /></button>
                            </div>
                        </div>
                    </nav>

                    <main className="flex-1 overflow-hidden max-w-7xl mx-auto w-full p-6 grid grid-cols-1 lg:grid-cols-12 gap-8">
                        {/* Kolom Kiri: Form Input */}
                        <aside className="no-print lg:col-span-4 h-full">
                            <div className="bg-white dark:bg-[#1e2124] p-6 rounded-[2rem] shadow-sm border border-slate-200 dark:border-slate-800">
                                <h2 className="text-base font-bold mb-4 flex items-center gap-2"><Icon name="user-plus" className="text-blue-500" size={16} /> Input Pasien Baru</h2>
                                <form onSubmit={handleSubmit} className="space-y-3">
                                    <input type="text" placeholder="Nama Lengkap" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full px-4 py-2.5 rounded-xl bg-slate-50 dark:bg-[#131517] border-none focus:ring-1 ring-blue-500 outline-none text-xs" required />
                                    <div className="grid grid-cols-2 gap-2">
                                        <input type="text" placeholder="No. RM" value={formData.recordNumber} onChange={e => setFormData({...formData, recordNumber: e.target.value})} className="w-full px-4 py-2.5 rounded-xl bg-slate-50 dark:bg-[#131517] border-none focus:ring-1 ring-blue-500 outline-none text-xs" required />
                                        <select value={formData.status} onChange={e => setFormData({...formData, status: e.target.value})} className="w-full px-4 py-2.5 rounded-xl bg-slate-50 dark:bg-[#131517] border-none focus:ring-1 ring-blue-500 outline-none text-xs">
                                            <option value="Hidup">Hidup</option>
                                            <option value="Meninggal">Meninggal</option>
                                        </select>
                                    </div>
                                    <input type="text" placeholder="Diagnosa Utama" value={formData.diagnosis} onChange={e => setFormData({...formData, diagnosis: e.target.value})} className="w-full px-4 py-2.5 rounded-xl bg-slate-50 dark:bg-[#131517] border-none focus:ring-1 ring-blue-500 outline-none text-xs" required />
                                    <textarea placeholder="Alamat Domisili" value={formData.address} onChange={e => setFormData({...formData, address: e.target.value})} className="w-full px-4 py-2.5 rounded-xl bg-slate-50 dark:bg-[#131517] border-none focus:ring-1 ring-blue-500 outline-none text-xs" rows="2" required></textarea>
                                    <button type="submit" className="w-full py-3 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 transition-all uppercase text-[10px] tracking-widest mt-1">Simpan Data</button>
                                </form>
                            </div>
                        </aside>

                        {/* Kolom Kanan: Preview & Daftar Pasien (DENGAN SCROLL INTERNAL) */}
                        <section className="lg:col-span-8 flex flex-col h-full overflow-hidden">
                            {/* Search Bar Tetap */}
                            <div className="no-print bg-white dark:bg-[#1e2124] px-4 py-2.5 rounded-2xl border border-slate-200 dark:border-slate-800 flex items-center gap-3 mb-4 shrink-0">
                                <Icon name="search" className="text-slate-400" size={14} />
                                <input type="text" placeholder="Cari berdasarkan nama atau RM..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} className="w-full bg-transparent outline-none text-xs" />
                            </div>

                            {/* Header Cetak (Hanya Muncul saat Print) */}
                            <div className="print-only mb-6 border-b-2 border-black pb-2 text-center">
                                <h1 className="text-2xl font-bold uppercase">RS Dian Husada</h1>
                                <p className="text-xs">Laporan Database Pasien HIV/AIDS</p>
                            </div>

                            {/* AREA SCROLLABLE DAFTAR PASIEN */}
                            <div className="flex-1 overflow-y-auto custom-scroll pr-1 no-print">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-3 pb-4">
                                    {filteredPatients.length > 0 ? filteredPatients.map(p => (
                                        <div key={p.id} className={`bg-white dark:bg-[#1e2124] p-4 rounded-2xl border border-slate-200 dark:border-slate-800 flex flex-col justify-between hover:border-blue-500/50 transition-colors shadow-sm ${p.status === 'Meninggal' ? 'opacity-60 grayscale-[0.2]' : ''}`}>
                                            <div>
                                                <div className="flex items-center justify-between mb-2">
                                                    <div className="flex items-center gap-2 min-w-0">
                                                        <div className={`w-2 h-2 rounded-full shrink-0 ${p.status === 'Hidup' ? 'bg-emerald-500' : 'bg-slate-400'}`}></div>
                                                        <span className="font-bold text-sm truncate">{p.name}</span>
                                                    </div>
                                                    <button onClick={() => handleDelete(p.id)} className="text-slate-300 hover:text-rose-500 transition-colors"><Icon name="trash-2" size={14} /></button>
                                                </div>
                                                <div className="flex flex-wrap gap-1.5 mb-2">
                                                    <span className="px-1.5 py-0.5 bg-blue-50 text-blue-600 dark:bg-blue-900/20 dark:text-blue-400 rounded-md text-[9px] font-bold">{p.recordNumber}</span>
                                                    <span className="px-1.5 py-0.5 bg-rose-50 text-rose-600 dark:bg-rose-900/20 dark:text-rose-300 rounded-md text-[9px] font-bold truncate max-w-[100px]">{p.diagnosis}</span>
                                                </div>
                                                <p className="text-[10px] text-slate-500 dark:text-slate-400 line-clamp-1 italic">{p.address}</p>
                                            </div>
                                        </div>
                                    )) : (
                                        <div className="col-span-full py-12 text-center text-slate-400 text-xs italic">
                                            Tidak ada data pasien yang tersedia.
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* Tampilan List Versi Cetak (Tanpa Scroll) */}
                            <div className="print-only print-list">
                                {filteredPatients.map(p => (
                                    <div key={p.id} className="card-item py-2 border-b flex justify-between items-center">
                                        <div className="flex-1 text-xs">
                                            <span className="font-bold">{p.name}</span> ({p.recordNumber}) - {p.diagnosis} - {p.status}
                                            <div className="text-[10px] text-gray-600">{p.address}</div>
                                        </div>
                                        <div className="text-[9px]">{p.dateAdded}</div>
                                    </div>
                                ))}
                            </div>
                        </section>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
